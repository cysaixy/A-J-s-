<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — A&J's Foodflix Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=7">
<style>
  body { background: #fff; background-image: none; }

  .login-page { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 100vh; }

  /* ---- Left: black menu board ---- */
  .login-board {
    background: var(--ink); color: #fff;
    padding: 44px 52px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .login-board::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.13) 2px, transparent 2.2px);
    background-size: 26px 26px;
    pointer-events: none;
  }
  .login-board > * { position: relative; }
  .board-mark {
    width: 56px; height: 56px; border-radius: 18px; background: #fff; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .board-mark svg { width: 34px; height: 34px; }
  .board-title {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(3rem, 7vw, 6rem); line-height: 0.92; letter-spacing: -0.045em;
    margin: 0;
  }
  .board-title small {
    display: block; margin-top: 14px;
    font-family: var(--font-body); font-weight: 500; font-size: 1.05rem;
    letter-spacing: 0; line-height: 1.4; color: rgba(255,255,255,0.66);
  }
  .board-menu { display: flex; flex-wrap: wrap; gap: 10px; }
  .board-menu span {
    border: 2px solid #fff; border-radius: var(--pill);
    padding: 7px 18px; font-weight: 700; font-size: 0.92rem;
  }

  /* ---- Right: sign-in ---- */
  .login-side { display: flex; align-items: center; justify-content: center; padding: 32px 24px; }
  .login-card { width: 100%; max-width: 380px; }
  .login-card h2 {
    font-family: var(--font-display); font-weight: 800; font-size: 2rem;
    letter-spacing: -0.03em; margin: 0 0 6px;
  }
  .login-card > p { margin: 0 0 26px; color: var(--ink-muted); font-size: 0.95rem; }

  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 0.84rem; font-weight: 700; margin-bottom: 7px; }
  .login-field input {
    width: 100%; padding: 12px 16px;
    border: 2px solid var(--ink); border-radius: var(--pill);
    font-family: var(--font-body); font-size: 0.95rem;
    background: #fff; color: var(--ink);
    transition: box-shadow var(--transition-fast);
  }
  .login-field input::placeholder { color: #9a9a9a; }
  .login-field input:focus { outline: none; box-shadow: 4px 4px 0 var(--ink); }

  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 48px; }
  .password-toggle {
    position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
    background: none; border: none; padding: 6px; cursor: pointer; color: var(--ink);
    opacity: 0.55; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: opacity var(--transition-fast);
  }
  .password-toggle:hover { opacity: 1; }
  .password-toggle .eye-closed { display: none; }
  .password-toggle.shown .eye-open { display: none; }
  .password-toggle.shown .eye-closed { display: block; }

  .login-submit { width: 100%; padding: 13px 20px; margin-top: 8px; font-size: 1rem; }

  .login-status { margin-top: 14px; font-size: 0.86rem; text-align: center; min-height: 20px; color: var(--ink-muted); }
  .login-status.err {
    color: var(--danger); font-weight: 600; background: #fdeceb;
    padding: 9px 14px; border-radius: 12px; border: 2px solid var(--danger);
  }
  .login-status.ok { color: var(--success); }

  .login-expired-notice {
    display: none; align-items: center; gap: 10px;
    background: #fff5dc; border: 2px solid var(--ink); border-radius: 14px;
    padding: 11px 14px; margin-bottom: 20px;
    font-size: 0.86rem; color: var(--ink); font-weight: 600;
  }
  .login-expired-notice.show { display: flex; }
  .login-expired-notice svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 820px) {
    .login-page { grid-template-columns: 1fr; }
    .login-board { padding: 28px 24px 30px; gap: 26px; }
    .board-title { font-size: 3.2rem; }
    .board-title small { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="login-page">
  <section class="login-board" aria-hidden="true">
    <div class="board-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2.5 13 6.5"/><path d="M5 8c0-1.7 3.1-3 7-3s7 1.3 7 3"/><path d="M4.5 8h15"/><path d="M6 8l1.3 11.6A1.6 1.6 0 0 0 8.9 21h6.2a1.6 1.6 0 0 0 1.6-1.4L18 8"/><circle cx="10" cy="17" r=".9" fill="currentColor" stroke="none"/><circle cx="13.5" cy="17.4" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="14.3" r=".9" fill="currentColor" stroke="none"/></svg></div>
    <h1 class="board-title">A&amp;J's<br>Foodflix<small>Staff panel for the counter, the kitchen and the stockroom.</small></h1>
    <div class="board-menu"><span>Milk tea</span><span>Snacks</span><span>Wings</span></div>
  </section>

  <main class="login-side">
    <div class="login-card">
      <h2>Sign in</h2>
      <p>Use your staff email and password.</p>

      <div class="login-expired-notice" id="expiredNotice">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Your session expired. Please sign in again.
      </div>

      <form id="loginForm">
        <div class="login-field">
          <label for="staffEmail">Email</label>
          <input id="staffEmail" type="email" required placeholder="staff@ajsfoodflix.com" autocomplete="username">
        </div>
        <div class="login-field">
          <label for="staffPassword">Password</label>
          <div class="password-wrap">
            <input id="staffPassword" type="password" required placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="password-toggle" data-toggle-pw="staffPassword" aria-label="Show password">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn login-submit" id="loginBtn">Sign in</button>
        <div class="login-status" id="loginStatus" role="status"></div>
      </form>
    </div>
  </main>
</div>

<script type="module">
  // Show the expired-session notice if redirected here with ?expired=1
  const params = new URLSearchParams(window.location.search);
  if (params.get('expired') === '1') {
    document.getElementById('expiredNotice').classList.add('show');
  }

  // Password visibility toggle
  document.querySelectorAll('[data-toggle-pw]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.togglePw);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('shown', !showing);
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  // Login form submission
  const form = document.getElementById('loginForm');
  const statusEl = document.getElementById('loginStatus');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'login-status';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';

try {
        const res = await fetch('/api/admin/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('staffEmail').value.trim(),
            password: document.getElementById('staffPassword').value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.error || 'Invalid email or password.';
          statusEl.className = 'login-status err';
          return;
        }

        // Token is set as httpOnly cookie by server
        localStorage.setItem('staffInfo', JSON.stringify(data.staff));
        // Also persist the csrfToken so adminFetch can fall back to it
        if (data.csrfToken) localStorage.setItem('__admin_csrf_token', data.csrfToken);

        const redirect = params.get('redirect') || 'dashboard.html';
        window.location.href = redirect;
    } catch (err) {
      statusEl.textContent = 'Connection error. Please try again.';
      statusEl.className = 'login-status err';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
